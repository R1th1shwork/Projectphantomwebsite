backend:
  name: github
  repo: R1th1shwork/Projectphantomwebsite
  branch: main
  base_url: https://decap-oauth.vercel.app
  auth_endpoint: /auth

media_folder: "assets/blog"
public_folder: "/assets/blog"

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "MMM YYYY", date_format: "MMM YYYY", time_format: false }
      - label: "Tag"
        name: "tag"
        widget: "select"
        options: ["Flight Test", "Hardware", "Software", "Mercury AI", "Team", "Event", "General"]
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Short Description", name: "excerpt", widget: "text", hint: "One or two sentences, shown on the blog feed cards." }
      - { label: "Full Post", name: "body", widget: "text", hint: "Separate paragraphs with a blank line." }
      - label: "Extra Images"
        name: "gallery"
        widget: "list"
        field: { label: "Image", name: "src", widget: "image" }
        required: false

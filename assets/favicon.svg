<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <mask id="logoMask" maskUnits="userSpaceOnUse" x="0" y="0" width="500" height="500">
      <image x="0" y="0" width="500" height="500" href="data:image/png;base64,"/>
    </mask>
  </defs>
  <style>
    .icon-fill { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .icon-fill { fill: #ffffff; }
    }
  </style>
  <rect class="icon-fill" x="0" y="0" width="500" height="500" mask="url(#logoMask)"/>
</svg>
